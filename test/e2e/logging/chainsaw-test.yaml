apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: logging
spec:
  bindings:
  steps:
  - name: install vector-aggregator
    try:
    - script:
        content: >-
          helm upgrade --install vector-aggregator vector
          --namespace $NAMESPACE
          --version 0.36.1
          --repo https://helm.vector.dev
          --values vector-aggregator-values.yaml
    - apply:
        file: vector-aggregator.yaml
    - assert:
        file: vector-aggregator-assert.yaml
  - name: install postgresql
    try:
    - apply:
        file: ../setup/database.yaml
    - assert:
        file: ../setup/database-assert.yaml
  - name: install zookeeper cluster
    try:
    - apply:
        file: ../setup/zookeeper.yaml
    - assert:
        file: ../setup/zookeeper-assert.yaml
    cleanup:
    - sleep:
        duration: 30s
  - name: install dolphinscheduler cluster
  - try:
    - apply:
        file: dolphinscheduler.yaml
    - assert:
        timeout: 400s
        file: dolphinscheduler-assert.yaml
    cleanup:
    - sleep:
        duration: 10s
  - name: assert dolphinscheduler logs
    try:
    - sleep:
        duration: 50s
    - script:
        env:
          - name: NAMESPACE
            value: ($namespace)
        content: |
          #!/bin/bash
          # Get logs from vector-aggregator-0 and check for specific log pattern
          kubectl -n $NAMESPACE logs statefulset/vector-aggregator -c vector | \
            grep -q '"cluster":"dolphinschedulercluster-sample","container":"dolphinscheduler","errors":\[\],"file":"dolphinscheduler.log4j.xml"'
          exit_code=$?

          if [ $exit_code -eq 0 ]; then
            echo "Found expected log pattern"
            exit 0
          else
            echo "Did not find expected log pattern"
            exit 1
          fi
    cleanup:
    - sleep:
        duration: 50s
